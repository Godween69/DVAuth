# Пример: DV Auth и своя база PostgreSQL. Скопируйте как docker-compose.yml и поправьте.
# Порты опубликованы только на 127.0.0.1: наружу их выводит ваш обратный прокси (см. docs/DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dvauth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # из файла .env рядом с этим файлом
      POSTGRES_DB: dvauth
    volumes:
      - dvauth-db:/var/lib/postgresql/data
  dvauth:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: dvauth.env
    environment:
      # Адрес базы внутри сети compose перекрывает значение из dvauth.env.
      DVAUTH_DATABASE_URL: postgres://dvauth:${POSTGRES_PASSWORD}@db:5432/dvauth
    ports:
      - "127.0.0.1:3010:3010"   # публичный порт (за прокси, только три адреса)
      - "127.0.0.1:3011:3011"   # внутренний API для ваших приложений
volumes:
  dvauth-db:
